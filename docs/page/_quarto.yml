project:
  type: website
  output-dir: _site
  pre-render: python sync_notebooks.py --verbose

execute:
  enabled: false

website:
  title: "TimeToAlign!"
  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: tutorials.qmd
        text: Tutorials
      - href: howto.qmd
        text: How-To Guides
      - href: concepts.qmd
        text: Explanation
      - href: reference.qmd
        text: API Reference
  sidebar:
    - title: "Tutorials"
      contents:
        - tutorials.qmd
        - text: "Quickstart"
          href: tutorials/tut00_quickstart.ipynb
        - section: "Foundations"
          contents:
            - text: "Timelines and Coordinates"
              href: tutorials/tut01_timelines_and_coordinates.ipynb
            - text: "Nesting and Timestamps"
              href: tutorials/tut02_nesting_and_timestamps.ipynb
            - text: "Events on a Timeline"
              href: tutorials/tut03_events.ipynb
        - section: "Working with Data"
          contents:
            - text: "Loading Real Data"
              href: tutorials/tut04_loading_data.ipynb
            - text: "Timeline Groups"
              href: tutorials/tut05_timeline_groups.ipynb
            - text: "Alignment Bundles and MatchClaims"
              href: tutorials/tut06_alignment_bundles.ipynb
            - text: "Flow Control and Grids"
              href: tutorials/tut07_flow_and_grids.ipynb
        - section: "Under the Hood"
          contents:
            - text: "The Data Model"
              href: tutorials/tut08_data_model.ipynb
            - text: "Pitch and Harmony across Formats"
              href: tutorials/tut09_pitch_and_harmony.ipynb

    - title: "How-To Guides"
      contents:
        - howto.qmd
        - section: "Timelines, Events & Maps"
          contents:
            - text: "How to Do Coordinate Math"
              href: howto/how01_coordinate_math.ipynb
            - text: "How to Use Advanced Conversion Maps"
              href: howto/how01_advanced_cmaps.ipynb
            - text: "How to Query Timestamps"
              href: howto/how01_advanced_timestamps.ipynb
            - text: "How to Construct Timelines Manually"
              href: howto/how01_manual_timeline_construction.ipynb
            - text: "How to Load Data"
              href: howto/how01_loading_data.ipynb
            - text: "How to Load Tabular Data"
              href: howto/how01_tabular_loaders.ipynb
            - text: "How to Work with Graphical Timelines"
              href: howto/how01_graphical_timelines.ipynb
            - text: "How to Transfer Annotations Between Graphical Analyses"
              href: howto/how01_thoresen_annotation_transfer.ipynb
            - text: "How to Build Beat Grids"
              href: howto/how01_beat_grids.ipynb
        - section: "TimelineGroups"
          contents:
            - text: "How to Align a Piano Roll (SUPRA)"
              href: howto/how02_supra_piano_roll.ipynb
            - text: "How to Save and Load Timelines, Groups and Bundles"
              href: howto/how02_group_and_bundle_files.ipynb
        - section: "AlignmentBundles"
          contents:
            - text: "How to Create a Note Alignment"
              href: howto/how03_create_note_alignment.ipynb
            - text: "How to Align Multimodal Data (Beethoven)"
              href: howto/how03_beethoven_multimodal.ipynb
            - text: "How to Load the Vienna 4x22 Corpus"
              href: howto/how03_loading_vienna_corpus.ipynb
            - text: "How to Load an Audio-to-Score Alignment Corpus and Compare Performances"
              href: howto/how03_performance_precision.ipynb
            - text: "How to Load a parangonada Note Alignment Across Several Performances"
              href: howto/how03_parangonada.ipynb
            - text: "How to Load an MPM-Toolbox Project (Score, Modelled Performance, Observed Alignment)"
              href: howto/how03_mpm_toolbox.ipynb
            - text: "How to Load an Audio-to-Audio Alignment (Listen Here!)"
              href: howto/how03_listen_here.ipynb
            - text: "How to Load an IEEE 1599 Document"
              href: howto/how03_ieee1599.ipynb
        - section: "In-depth Topics"
          contents:
            - text: "How to Encode Song Genesis (Hendrix)"
              href: howto/how04_hendrix_song_genesis.ipynb
            - text: "How to Load CSV/TSV with column_specs and field_specs"
              href: howto/how04_loading_csv.ipynb
            - text: "How to Load Anything"
              href: howto/how04_load_anything.ipynb

    - title: "Explanation"
      contents:
        - concepts.qmd
        - section: "Quick Reference"
          contents:
            - glossary.qmd

    - title: "API Reference"
      contents:
        - reference.qmd
        - text: "Developers' Reference"
          href: contributing.qmd
        - auto: reference

metadata-files:
  - reference/_sidebar.yml

format:
  html:
    theme: cosmo
    css:
      - styles.css
      - reference/_styles-quartodoc.css
    toc: true
    toc-depth: 4

filters:
  - glossary
  - interlinks

glossary:
  path: glossary.yml
  popup: hover
  show: true

interlinks:
  sources: {}

quartodoc:
  package: timetoalign
  parser: google
  renderer:
    style: _renderer.py
  dir: reference
  sidebar: reference/_sidebar.yml
  css: reference/_styles-quartodoc.css
  title: API Reference
  style: pkgdown
  render_interlinks: true
  sections:
    - title: Core Types
      desc: Fundamental types for coordinates, units, domains, and cross-section timestamps.
      contents:
        - Coordinate
        - CoordinateField
        - Coord
        - CoordinateSpec
        - CoordinateValue
        - IdCoordinate
        - Interval
        - IntervalField
        - OptionalCoordinate
        - ResolvedCoordinate
        - resolve_coordinate_spec
        - Domain
        - TimeUnit
        - NumberType
        - EventType
        - ColumnNaming
        - ColumnRole
        - ScopedId
        - IdGenerator
        - TimeStamp
        - TimeIntervalStamp

    - title: Timelines
      desc: Timeline classes for all six domain/modality combinations.
      contents:
        - name: Timeline
          package: timetoalign.timelines
          include_inherited: true
        - name: ContinuousLogicalTimeline
          package: timetoalign.timelines
        - name: DiscreteLogicalTimeline
          package: timetoalign.timelines
        - name: ContinuousPhysicalTimeline
          package: timetoalign.timelines
        - name: DiscretePhysicalTimeline
          package: timetoalign.timelines
        - name: ContinuousGraphicalTimeline
          package: timetoalign.timelines
        - name: DiscreteGraphicalTimeline
          package: timetoalign.timelines
        - name: LogicalTimeline
          package: timetoalign.timelines
        - name: PhysicalTimeline
          package: timetoalign.timelines
        - name: GraphicalTimeline
          package: timetoalign.timelines
        - name: SegmentLine
          package: timetoalign.timelines
        - name: UnknownLengthError
          package: timetoalign.timelines

    - title: Beat Grids
      desc: Tempo segments that generate a labelled lattice of beats on a seconds axis.
      contents:
        - name: BeatGrid
          package: timetoalign.timelines
        - name: BeatGridSegment
          package: timetoalign.timelines
        - name: GridBeat
          package: timetoalign.timelines
        - name: BeatPolicy
          package: timetoalign.core
        - name: policy_for_metro
          package: timetoalign.timelines

    - title: Flow Control
      desc: Score flow-graph traversal, atomic-section labelling, and structural diagnostics.
      contents:
        - name: Flow
