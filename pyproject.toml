[project]
name = "timetoalign"
version = "1.2.0"
description = "A library for representing and aligning musical timelines"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    {name = "Johannes Hentschel and the TimeToAlign! authors and contributors"}
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]

# Core dependencies — kept minimal so that `pip install timetoalign` is lightweight.
# Only the data backbone (PyArrow, pandas), graph library (NetworkX), and
# typing backports are required.  All file-format-specific loaders pull in
# their dependencies through the optional extras below.
dependencies = [
    "pyarrow>=14.0",
    "pandas>=2.0",
    "networkx>=3.0",
    "typing_extensions>=4.0",
    "pydantic>=2.7,<3",
]

[project.optional-dependencies]
# ---------------------------------------------------------------------------
# Atomic extras — one concern each
# ---------------------------------------------------------------------------
midi = ["mido>=1.3"]                          # MIDI file loading (PerformanceMidiLoader)
partitura = [
    "partitura>=1.5",
    "setuptools<82" # due to partitura's using pkg_resources
]                                             # Score parsing via partitura (PartituraLoader, ScoreMidiLoader)
music21 = ["music21>=9.0"]                    # Score parsing via music21 (Music21Loader)
ms3 = ["ms3>=2.6.0"]                          # DCML TSV score parsing (Ms3Loader)
audio = ["soundfile>=0.12", "mutagen>=1.47"]  # Audio file loading + MP3/M4A metadata
graphical = ["pymupdf>=1.24", "pillow>=10.0"] # PDF/image loading & drawing
plot = ["matplotlib>=3.5"]                    # Visualisation
delta = ["deltalake>=0.15.0"]                 # Delta Lake columnar storage (future)
rdf = ["rdflib>=7.0"]                         # RDF / linked-data export (future)
examples = ["pooch>=1.8"]                     # On-demand fetching of bundled corpora (timetoalign.testdata)

# ---------------------------------------------------------------------------
# Composite extras — convenience bundles
# ---------------------------------------------------------------------------
scores = [                                    # All score-loader backends
    "timetoalign[partitura,music21,ms3]",
]
loaders = [                                   # Every loader dependency
    "timetoalign[midi,scores,audio,graphical]",
]
tutorial = [                                  # Everything needed for the tutorial notebooks
    "timetoalign[loaders,plot,examples]",
    "jupytext>=1.16",
    "jupyter>=1.0",
]
docs = [                                      # Documentation site building
    "timetoalign[tutorial]",
    "quartodoc>=0.7",
    "griffe>=1.3,<2",                         # quartodoc 0.11 incompatible with griffe 2.0
]
all = [                                       # All runtime features
    "timetoalign[tutorial,delta,rdf]",
]
testing = [                                   # Test-suite execution (used by `tox -e py3xx`, with the `conformance` group)
    "timetoalign[all,examples]",
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-xdist>=3.5",
    "pytest-benchmark>=4.0",
    "hypothesis>=6.100",
]
dev = [                                       # Testing + docs + lint/format tooling
    "timetoalign[testing,docs]",
    "pre-commit>=2.20",
    "ruff>=0.1",
    "tox>=4.0",
]

[dependency-groups]
# Test oracles the suite needs beside the `testing` extra. A dependency group
# (PEP 735) is not part of the distribution metadata, so the git reference of
# `pymeasuremap` never reaches a published Requires-Dist. Install with
# `pip install --group conformance` (pip >= 25.1); tox installs it for every
# test environment.
conformance = [
    "pymeasuremap @ git+https://github.com/measure-map/pyMeasureMap.git@ddcfec3",
    # Measure Map reference implementation, the test oracle for compressed rows; registry pin once a release carries compress
    "timeskeleton>=0.2.1,<1",
    # TimeSkeleton schema conformance of the eventless manifest (validator, canonical_order and the 0.2.1 fixtures)
]

[project.urls]
Homepage = "https://github.com/timetoalign/timetoalign"
Documentation = "https://timetoalign.github.io/"
Repository = "https://github.com/timetoalign/timetoalign"
Changelog = "https://github.com/timetoalign/timetoalign/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["timetoalign"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-n auto"
markers = ["slow: long-running corpus-scale integration test; skipped unless --runslow is given"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]

[tool.coverage.run]
source = ["timetoalign"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@abstractmethod",
]
