on:
  push:
    branches:
      - main

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

name: release-please

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          release-type: python

      # A tag pushed with the workflow token starts no workflow, so the
      # documentation of the release is published by dispatching docs.yml.
      - name: Publish the documentation of the release
        if: ${{ steps.release.outputs.release_created }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: gh workflow run docs.yml --repo "$GITHUB_REPOSITORY" --ref main -f ref="$TAG"
