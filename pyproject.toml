[project]
name = "timetoalign"
version = "1.2.0"
description = "A library for representing and aligning musical timelines"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    {name = "Johannes Hentschel and the TimeToAlign! authors and contributors"}
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]

# Core dependencies — kept minimal so that `pip install timetoalign` is lightweight.
# Only the data backbone (NumPy, PyArrow, pandas), graph library (NetworkX), typing
# backports and the TimeToShare model of links (timetoshare) are required.
# All file-format-specific loaders pull in their dependencies through the
# optional extras below.
dependencies = [
    # PyArrow 26 requires NumPy 2 at runtime; ms3 currently requires NumPy <2.
    "pyarrow>=14.0,<26",
    "numpy>=1.26.4",
    "pandas>=2.0",
    "networkx>=3.0",
    "typing_extensions>=4.0",
    "pydantic>=2.7,<3",
    # The manifest format: links and schemes, their validator and the registry of
    # identifier schemes. Its development branch until a release carries schema
    # 0.2.0, then the registry range.
    "timetoshare @ git+https://github.com/TimeToAlign/TimeToShare.git@main#subdirectory=python",
]

[project.optional-dependencies]
# ---------------------------------------------------------------------------
# Atomic extras — one concern each
# ---------------------------------------------------------------------------
midi = ["mido>=1.3"]                          # MIDI file loading (PerformanceMidiLoader)
partitura = [
    "partitura>=1.5",
    "setuptools<82" # due to partitura's using pkg_resources
]                                             # Score parsing via partitura (PartituraLoader, ScoreMidiLoader)
music21 = ["music21>=9.0"]                    # Score parsing via music21 (Music21Loader)
ms3 = ["ms3>=2.6.0"]                          # DCML TSV score parsing (Ms3Loader)
verovio = ["verovio>=4.4"]                    # Engraved-score loading via Verovio (VerovioLoader)
audio = ["soundfile>=0.12", "mutagen>=1.47"]  # Audio file loading + MP3/M4A metadata
graphical = ["pymupdf>=1.24", "pillow>=10.0"] # PDF/image loading & drawing
plot = ["matplotlib>=3.5"]                    # Visualisation
delta = ["deltalake>=0.15.0"]                 # Delta Lake columnar storage (future)
rdf = ["rdflib>=7.0"]                         # MeLODy Turtle import (MelodyLoader)
examples = ["pooch>=1.8"]                     # On-demand fetching of bundled corpora (timetoalign.testdata)

# ---------------------------------------------------------------------------
# Composite extras — convenience bundles
# ---------------------------------------------------------------------------
scores = [                                    # All score-loader backends
    "timetoalign[partitura,music21,ms3,verovio]",
]
loaders = [                                   # Every loader dependency
    "timetoalign[midi,scores,audio,graphical,rdf]",
]
tutorial = [                                  # Everything needed for the tutorial notebooks
    "timetoalign[loaders,plot,examples]",
    "jupytext>=1.16",
    "jupyter>=1.0",
]
docs = [                                      # Documentation site building
    "timetoalign[tutorial]",
    "quartodoc>=0.7",
    "griffe>=1.3,<2",                         # quartodoc 0.11 incompatible with griffe 2.0
]
all = [                                       # All runtime features
    "timetoalign[tutorial,delta,rdf]",
]
testing = [                                   # Test-suite execution (used by `tox -e py3xx`, with the `conformance` group)
    "timetoalign[all,examples]",
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-xdist>=3.5",
    "pytest-benchmark>=4.0",
    "hypothesis>=6.100",
]
dev = [                                       # Testing + docs + lint/format tooling
    "timetoalign[testing,docs]",
    "pre-commit>=2.20",
    "ruff>=0.1",
    "tox>=4.0",
]

[dependency-groups]
# Test oracles the suite needs beside the `testing` extra, as git references;
# a dependency group (PEP 735) is not part of the distribution metadata, so
# none reaches a published Requires-Dist. Install with
# `pip install --group conformance` (pip >= 25.1); tox installs it for every
# test environment. The TimeToShare package, the oracle for manifests, is a
# runtime dependency above.
conformance = [
    "pymeasuremap @ git+https://github.com/measure-map/pyMeasureMap.git@ddcfec3",
    # Measure Map reference implementation, the test oracle for compressed rows; registry pin once a release carries compress
]
# Type information the type checker needs beside the library's own
# dependencies: PyArrow ships none, so without these stubs every
# `pyarrow.compute` function is unknown to pyright. Check-time only; install
# with `pip install --group typing`.
typing = [
    "pyarrow-stubs>=20",
]

[project.urls]
Homepage = "https://github.com/timetoalign/timetoalign"
Documentation = "https://timetoalign.github.io/"
Repository = "https://github.com/timetoalign/timetoalign"
Changelog = "https://github.com/timetoalign/timetoalign/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
# The git reference to timetoshare until its release; PyPI refuses a direct
# reference in Requires-Dist, so a release needs the registry range first.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["timetoalign"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-n auto"
markers = ["slow: long-running corpus-scale integration test; skipped unless --runslow is given"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]

[tool.importlinter]
root_package = "timetoalign"
exclude_type_checking_imports = true

[[tool.importlinter.contracts]]
name = "Subpackages form layers: higher layers may import lower ones, never the reverse"
type = "layers"
layers = [
    "loader",
    "alignment",
    "timelines",
    "storage",
    "maps | display",
    "core",
]
containers = ["timetoalign"]
ignore_imports = [
    # Known exceptions, to be removed rather than added to.
    "timetoalign.core.timestamp -> timetoalign.maps.base",
    "timetoalign.core.timestamp -> timetoalign.display.html",
    "timetoalign.core.fields -> timetoalign.display.html",
    "timetoalign.storage.store -> timetoalign.timelines",
    "timetoalign.storage.events -> timetoalign.timelines",
]

[tool.pyright]
# Static type checking, run by hand with `pyright` from this directory after
# `pip install --group typing`. It covers the core package only; a subpackage is
# added to `include` once it passes.
include = ["timetoalign/core"]
typeCheckingMode = "standard"
pythonVersion = "3.11"
# Modules held to strict mode; the list grows module by module.
strict = [
    "timetoalign/core/__init__.py",
    "timetoalign/core/backends.py",
    "timetoalign/core/enums.py",
    "timetoalign/core/ids.py",
    "timetoalign/core/protocols.py",
    "timetoalign/core/retrieval.py",
]

[tool.coverage.run]
source = ["timetoalign"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@abstractmethod",
]
