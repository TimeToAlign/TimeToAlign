# TimeToAlign! Glossary of Terms
# Alphabetical listing of model terminology
# Last updated: 2026-02-28 — Harmonized with TISMIR manuscript glossary table;
# added FlowMap, aligned all definitions with article.

Accolade: |
  One line of a page of music (a system), read from left to right: one
  horizontal piece of the page's time path, and the timeline along it. An
  accolade is as long as its piece, states the area of the image it stands
  for in meta["box"] and the image in meta["image"], and holds the Boxes of
  the areas lying on it. A page is the segment line of its accolades, a
  volume the segment line of its pages; neither states an area.
  TimeAxisPath.from_boxes() finds the accolades among the areas of a page
  given in reading order: a box begins a new accolade when its left edge
  lies left of the previous box's by more than half the span of all left
  edges (group_into_accolades).

AlignmentAnchor: |
  A coordinate pair associating one coordinate on timeline A with one on
  timeline B; a neutral record with no claim semantics. Provenance and
  interpretation are carried by the enclosing MatchClaim. Only synchronous
  MatchClaims produce AlignmentAnchors.

AlignmentBundle: |
  A collection of TimelineGroups with inter-group MatchClaim connections;
  provides coordinate transfer via offset arithmetic, interpolation, and
  WarpMaps.

AlignmentMatrix: |
  An audio-to-audio alignment in which several recordings of one work are each
  warped onto a single shared, equidistant reference grid. Per recording, a
  parallel onset-time array gives that recording's clock-time at each grid
  column; because every array indexes the same grid they are equal length, so
  together they form a dense matrix of shape (recordings × grid columns). A
  single such file encodes an entire MatchGraph directly — every pair of
  recordings is related at every grid column — rather than only one
  score-to-performance correspondence. Read by ListenHereLoader, with the
  complete pairwise claim set held in a MatchClaimField.

Archive member: |
  A file inside a ZIP archive, named by the standard library's zipfile.Path
  (the archive and the member's path inside it). Every loader reads an archive
  member wherever it reads a path, without extracting the archive; a loader
  whose parser needs a file on disk reads the copy materialize() makes once
  in a cache. A string is always a filesystem path, never a member. A loader's
  metadata["sources"] records a member as the archive's absolute path plus
  member, its path inside the archive.

Atomic section: |
  A stretch of a timeline's axis that its flow control never divides: an
  interval between consecutive coordinates of its Jumps, JumpTargets, Breaks
  and SectionBreaks and the places their destinations go on at, named by a
  letter (A, B, ..., Z, AA, ...) in the order of the axis. Every flow is a
  sequence of atomic sections. Timeline.create_flow_maps_from_flow_control()
  writes them as Regions stating the type tts:AtomicSection, and the computed
  FlowMaps list them.

Barline: |
  A flow-control element recording a barline the source prints (a double or a
  final barline). It changes nothing in the flow.

BeatGrid: |
  An ordered set of BeatGridSegments and the beats they generate on a seconds
  axis. Each segment states one stretch of a recording — an anchor instant, a
  tempo, a BeatPolicy, and which beat of a bar the anchor is — and generates
  beats without end; the grid orders the segments, bounds each by its
  successor's start and the last by its extent, and labels the resulting beats
  with measure and beat numbers. A BeatGrid is not a Timeline and stores
  nothing per beat.

BeatPolicy: |
  How one bar is counted in beats: a grouping cycle over one counted note
  value. A 4/4 bar is four beats of a quarter, a compound 6/8 bar two beats of
  three eighths, an uneven (3+2+3)/8 bar three beats of unequal length. Beat
  lengths are derived from the grouping and the division, never stored. One
  signature admits more than one counting: a BeatGrid's lattice reads 6/8 as
  six beats of an eighth, because its beat-in-bar index counts the notated
  value rather than the felt pulse.

BoundingBox: |
  An axis-aligned area of an image: x, y, width and height (the xywh of IIIF
  and Media Fragments), in image space (origin the image's top-left corner,
  x right, y down), all four in one unit and one number type; width and
  height are never negative. A Shape, as is Quadrilateral: built with
  from_xywh(), from_corners() (MEI's ulx, uly, lrx, lry) or
  from_media_fragment(), and written with to_dict(), as_media_fragment(),
  as_svg_points() and as_mei_zone(). Its numbers are never rounded: a value
  the axis cannot hold exactly (385.5 on pixels) is refused. Every shape has
  a bounding box, the smallest BoundingBox holding it.

Box: |
  An area of an image as an interval event of a graphical timeline running
  along a horizontal piece of the image's time path, such as an accolade of
  a page. A Box holds exactly one shape, a BoundingBox or a Quadrilateral,
  in the image's space, and the interval of the shape's x extent on its
  timeline: start is the shape's x_min less the x at which the timeline
  stands in its image (the x of its meta["box"], 0 where it states none),
  duration is x_max − x_min. Box.from_shape(shape, origin=, id=) makes it;
  adding a Box whose interval contradicts its shape, or whose shape is on
  another unit or number type than the timeline, is refused on every path
  that adds events, a package read included. DmosLoader and
  MeiFacsimileLoader read Boxes onto the accolades of their pages and name
  them with box_ids; an AlignmentBundle's to_file() writes every
  timeline's Boxes beside the manifest in one table, boxes.parquet, named
  in its resources with the type Box, and from_file() reads them back.

Break: |
  A flow-control element at which the flow does not go on: when the flow
  plays up to it, a Jump at the same coordinate with a destination that holds
  is taken, otherwise the flow ends there and begins again at the next
  SectionBreak, if any. With ends (a condition: passes, after) it ends the
  flow only while that condition holds, as a Fine does after a D.C. or D.S.
  A Break lies between two brackets of alternative endings.

Catalogue: |
  Data shipped with the TimeToShare package that guides the writing of
  statements and that tools read to offer properties and values and to print
  pairs in words: the prefixes of the vocabularies its patterns use, from
  which a written manifest's inline @context takes those its statements use;
  aliases, namespaces read as equal; the identifier systems (Wikidata,
  MusicBrainz, the GND, VIAF, MeLODy with LRMoo, IMSLP and others, and the
  fallback vocabularies); the verbs, relations in words (is_a, performed_by,
  part_of, ...) each with a pattern per system; and the types of thing a
  subject or value is. The validators never consult it. add_verb() states a
  verb in one system's vocabulary, and get_rectangles() gathers the pairs it
  reads as one verb about one thing.

ChainMap: |
  A MultiMap that applies multiple ConversionMaps in sequence, creating a conversion
  path from source to target unit.

Child: |
  A timeline nested within a parent, sharing its measuring unit but defining
  its own origin. Coordinate transfer between parent and child uses exact offset
  arithmetic, applied recursively. add_child() locks a child by default; an
  unlocked child may grow, contained by its parent like any content. A child
  holds its parent's positions from its start up to its end, and its end only
  where no sibling starts there; a nested timeline is reached only through
  parents that all hold the position. A child created with measures=True
  holds the slice of its parent's measure map over its span; by default it
  holds none.

CHUNK: |
  A sentinel value in a synchronous MatchClaim for a side whose coordinate the
  claim states without an event: the claim's AlignmentAnchors hold the
  coordinate (its start, and its end for a span), and no event or Projection
  is added. A synchronous claim between two bare positions is CHUNK on both
  sides; MatchClaim.from_events() also takes a position on one side only. The
  MatchClaim table writes it as CHUNK_SENTINEL in the side's event ID column;
  in code it is the constant CHUNK, and MatchClaim.chunk_sides lists the
  timelines of a claim's CHUNK sides. Unrelated to the chunks of a FlowMap,
  the stretches it plays.

ClaimType: |
  The semantic kind of a MatchClaim, derived from its structure rather than
  stored: read from whether the claim is synchronous and whether both of its
  sides name an event or one names the NOMATCH sentinel. Each side of a
  MatchClaim names an event or a sentinel: a side without an event of its own
  is given a Projection, except on a synchronous claim between two bare
  positions, which is CHUNK on both sides. Three members: event_match
  (synchronous, an event or CHUNK on each side — the case that yields
  AlignmentAnchors), nomatch
  (non-synchronous, one event and the sentinel on the other side — see
  NOMATCH), and conceptual (non-synchronous, an event on each side — a
  structural correspondence with no temporal commitment). What a MatchGraph
  infers through groups is the graph's own inferred edge and has no kind here.

CombinationMap: |
  A MultiMap yielding outputs from multiple ConversionMaps simultaneously
  (e.g., (x, y) coordinate pairs).

Commensurability: |
  Two timelines are commensurable if connected by a chain of C-maps, membership
  in the same TimelineGroup, or cross-group MatchClaims, enabling coordinate
  translation between them.

Commensurable: |
  See Commensurability.

Complete form: |
  The form in which to_dict(minimal=False) writes a TimeToShare manifest:
  every key the format defines is written, those holding their default value
  included (null, {}, []). A key whose default is its absence, such as a
  manifest's id or a root timeline's offset, is written only when it has a
  value. The complete and the minimal form of one object read back to equal
  objects, and each writes back to itself.

ConcatenationMap: |
  A MultiMap combining bounded ConversionMaps such that each coordinate region is
  handled by a specific map. Also called PiecewiseMap.

Contiguity: |
  A TimeInterval is contiguous if it monotonically spans all coordinates between
  its start and end. An Instant is contiguous with a TimeInterval if it is
  synchronous with its EndInstant.

ConversionMap: |
  A typed function attached to a timeline that maps each coordinate to exactly
  one value (coordinate, label, or filename); also permits inverse conversion
  back to the timeline's own unit. Also called C-map.

Coordinate: |
  A position on a timeline, expressed as the distance from the origin in the
  timeline's measuring unit. Combines a numeric value with a TimeUnit. The unit
  alone decides the number policy: quarters and beats are exact Fractions,
  discrete units (ticks, samples, frames, pixels) are locked to int, and the
  remaining continuous units (seconds, points, centimeters, …) are float. That
  declared number type is preserved at every boundary — authored, converted,
  interpolated, queried or retrieved — so a fraction-canonical axis always
  yields Fractions and a float-canonical axis always yields floats. An explicit
  number_type= overrides the default, and exact input is never degraded.

Finding: |
  What playing flow control found, without raising: a flow that never ends
  (endless_loop), a flow ending at a Break that states no condition before
  the end (flow_ends_at_break), two destinations of one Jump holding at once
  (ambiguous_targets), a destination nobody can check (undetermined_target),
  and a stretch never played (never_played). The default and single flows
  have findings, the printed flow none; Timeline.get_flow(convention)
  returns them with the flow. A finding may name its cause: a stretch the
  single flow leaves out that the default flow plays has the cause
  single_playback (going through once takes the last volta ending).

Flow control element: |
  One of the elements a timeline holds as its flow control (written as its
  flow_control array): a Jump, a JumpTarget, a Break, a SectionBreak or a
  Barline. Each lies at one coordinate and has an element id; how it looks in
  the source is its manifestation, which decides nothing. An element is never
  changed or deleted to repair flow control: an actor's belief "false" rejects
  it, and the right one is added. Timeline.get_flow() plays the elements no
  actor rejects.

FlowMap: |
  One order in which stretches of one root timeline are played: an ordered
  list of chunks, each the ID of a Region, a child timeline or a virtual
  timeline of that timeline's tree, or a Gap in which nothing of the timeline
  is played. A FlowMap holds no interval; resolved against its timeline it
  places each stretch where the one before it ends and converts positions both
  ways (unfold: a position of the timeline to every position it is played at;
  fold: a position of the flow to the position it plays, or None in a gap).
  Timeline.create_flow_map(chunks) creates and attaches one;
  Timeline.create_flow_maps_from_flow_control() writes the flows of the flow
  control (default, single, printed) as FlowMaps over the atomic sections.

Destination: |
  One place a Jump may go on at, and when: a JumpDestination. Its place is
  to (the ID of a JumpTarget, a Region, a child timeline or the timeline
  itself), by (a signed distance from the Jump; by 0 is going on and is never
  taken) or neither (the start of its section). Its conditions all must hold:
  passes (the arrivals at the Jump that count), repeat_count (taken at most
  that often), after (another Jump's destination must have been taken) and
  determined (false for a choice nobody can check, such as an ossia, which is
  never taken). reset says whether going back restores the Jumps and Breaks
  gone back over, as a repeat does; a D.C. or D.S. played without repeats
  states reset false.

DictStore: |
  A generic EventStore subclass holding a dict[str, EventData] with arbitrary
  keys. Used internally by AlignmentLoaders to store one EventData table per
  timeline-to-be (e.g., "score", "perf:p01", "perf:p02"). Maintains the
  uniform EventStore interface (iteration, keys, items, getitem).

Discrete: |
  A timeline is discrete when coordinates exist only at discrete points
  (e.g., pixels, samples, ticks). Contrast with Continuous timelines where
  coordinates can take any real value (e.g., seconds, quarters).

Domain: |
  One of three temporal categories: Graphical (visual/spatial), Logical
  (symbolic/musical), or Physical (audio/sound). Each domain has both
  discrete and continuous timeline variants.

element id: |
  The id that identifies an element of a manifest: the manifest's own, a
  timeline (root or descendant), TimelineGroup, MeasureMap, ConversionMap at
  any nesting depth, Region, flow-control element, FlowMap, virtual timeline
  or Resource. It is unique
  across the whole manifest and every kind, so the id alone names the element.
  An id is free: whatever was given is kept verbatim, any non-empty string
  without a control character; spaces, colons, slashes and URIs are allowed,
  and no word is reserved. Only an element given no id gets a minted one,
  when it is constructed: a prefix, _ and 13 random base-36 characters
  (region_3kq9x0m2ztb7a). The characters are seeded, so a run repeats them:
  a loader seeds from the bytes it reads, an object built in code from its
  content, and a seed= argument makes them exact. The prefix names the kind:
  clt, dlt, cpt, dpt, cgt or dgt for a timeline (continuous or discrete,
  logical, physical or graphical), group for a group, measure_map for a
  MeasureMap, cmap for a conversion map, region for a Region,
  resource for a Resource, jump, jump_target, break, section_break or
  barline for a flow-control element and flow for a FlowMap; a virtual
  timeline is minted as a timeline of its unit; a loader role leads it
  (score:clt_…). An id is never renamed: when trees are joined into a group
  or bundle, an id held twice is refused, minted or given alike, for every
  kind of element, before anything changes. The id identifies, the name
  displays: a name may be absent or repeat, and an id is never derived from
  it.

EndAnchor: "The second AlignmentAnchor of a synchronous interval MatchClaim, derived from the end coordinates."

EndInstant: |
  An Instant marking the end of a TimeInterval. Implies the presence of a
  corresponding StartInstant with coordinate <= EndInstant's coordinate.

Event: |
  Anything associated with a timeline via Instants. An InstantEvent has zero
  duration; a TimeIntervalEvent has duration defined by start and end coordinates.

IdCoordinate: |
  A Coordinate that also names the timeline it belongs to. It is the default
  return of every coordinate getter in the library — stamps, timelines, groups,
  bundles, match lines, graphs and warp maps all hand back
  IdCoordinate(value, unit, timeline_id) unless an explicit format= asks for
  something else. Carrying identity is what lets a retrieved coordinate be
  handed straight back as a query without restating which axis it came from.
  IdCoordinate never compares equal to a plain Coordinate in either direction;
  use format="coordinate" when timeline identity should be discarded.

Instant: |
  Associates a coordinate (a "time-point") with a signification such as
  "start of event e". Instants sharing a coordinate are synchronous.

InstantEvent: |
  An event defined by a single Instant, having zero duration. Contrast with
  TimeIntervalEvent which has a duration.

Interval: |
  A frozen scalar pairing two plain Coordinates as a half-open span
  [start, end): the start is inclusive, the end exclusive. Both endpoints must
  share one TimeUnit and one number type, which makes the interval's own unit
  and number_type unambiguous; its duration is exactly end - start, returned as
  a Duration. Reversed intervals raise; zero-length ones are valid. It renders
  through the same formatter the scalars use, so
  str(Interval(Coordinate(Fraction(1, 2), quarters),
  Coordinate(Fraction(3, 2), quarters))) is "[1/2, 3/2) quarters". Interval is
  the scalar leaf of interval retrieval: TimeIntervalStamp.get_interval() and
  TimelineGroup.get_interval_for() both return one.

IntervalField: |
  The SemanticField paired with Interval. It stores a struct of start and end
  coordinate structs under one unit, domain, and number_type metadata triple,
  materialises Interval | None per row, and exposes vectorized start, end, and
  duration accessors returning CoordinateField, CoordinateField, and
  DurationField.

InverseMap: "The reverse transformation of a bijective ConversionMap."

Jump: |
  A flow-control element where the flow may leave the axis, holding one
  Destination for every place it may go on at: a repeat end, a D.C., a D.S.,
  a To Coda and the brackets of alternative endings at one coordinate are
  destinations of one Jump. When the flow plays up to it, of the destinations
  that hold one is taken (one going back with reset first, then one going
  back without, then one ahead, the nearest first); when none holds, the flow
  goes on.

JumpTarget: |
  A flow-control element marking a place a destination names by its element
  id: a repeat start, a segno, a coda, a bracket. Nothing happens when the
  flow plays up to it.

Length: |
  The distance between a timeline's origin and its last Instant, or None when
  it is not known (see Unknown length). A locked timeline cannot extend its
  length.

Locked: |
  A timeline state that fixes its coordinate axis: no Instants may be added
  after the last time-point, so its length cannot change. Locking governs the
  coordinate axis only — non-structural annotations such as Regions may still be
  added to a locked timeline. A timeline is locked with locked=True, when
  add_child() embeds it with its default locked=True, or after construction
  with lock(); a child read from a manifest keeps the manifest's locked. A
  lock cannot be lifted. A locked timeline's length may still be unknown. On
  a locked timeline, setting length, append_child() and append_segment()
  raise RuntimeError, and content, a child or a MatchClaim position
  (AlignmentBundle.create_match_claims()) past its end is refused with a
  ValueError before anything is added, unless add_events() or add_child() is
  given allow_expansion=True; create_child_from_region() gives a child of any
  region within its length. A loader locks a timeline whose source states its
  length: AudioLoader a recording at the file's length, a score loader a score
  whose measures all state their length, at the end of its last measure or of
  its last event, whichever is later.

MatchfileLoader: |
  Loader for Vienna Match (.match) alignment files. Uses the standard two-step
  load() → create_*() pattern. A single instance processes all .match files that
  share the same score, building a shared score timeline on the first file and
  verifying subsequent files against it. Returns an AlignmentBundle directly via
  create_alignment_bundle(). Score goes into its own group; performances are
  standalone timelines; MatchClaims connect score to performances.

MatchClaim: |
  A claim of equivalence between two events on different timelines, each
  coordinate on its own timeline's axis, with its Provenance (how it was made
  and who believes it) and a certainty. A side without an event of its own is
  given a Projection, or is the sentinel CHUNK on a synchronous claim stated
  from positions. May be synchronous (producing AlignmentAnchors) or not:
  conceptual (structural equivalence without temporal commitment) or NOMATCH
  (an event on one side, the sentinel on the other). A MatchClaim is always
  stated: what a MatchGraph infers through groups is the graph's own (its
  inferred edges), never a MatchClaim. A person stating claims is recorded as
  believing them "true" (create_match_claims(..., actor=)). A claim is never
  deleted: who disagrees records a belief "false" in it
  (AlignmentBundle.add_match_claim_belief()), and every reader of claims, the
  MatchStamp and coordinate getters included, takes the belief filter
  (believer=, beliefs=; see Provenance). Readers of claims take the same
  timeline filters: timeline_ids keeps a claim with any of the named timelines
  on either side, within a claim whose both timelines are in the set. Held
  individually, or in the bundle's one MatchClaim table, a MatchClaimField.
  Its ID never changes: a claim given none is minted one when it is
  constructed (claim_ and 13 random characters, seeded from the claim's
  content or by seed=), and joining an AlignmentBundle mints nothing. A
  MatchClaim is addressed by its ID alone: a
  bundle or field already holding an ID refuses a second claim under it, and
  merging bundles (from_bundles()) refuses, before anything is merged, two
  sources holding one ID.

MatchClaimField: |
  The MatchClaim table: a columnar, PyArrow-backed store holding a set of
  MatchClaims of every kind as Arrow columns, one per property of a MatchClaim
  (the two timeline IDs, the start and end anchors, each holding coordinate_a
  and coordinate_b only, the row's timelines being theirs, is_synchronous, the
  provenance and certainty, the event IDs, each an event's ID or a
  sentinel's string and never null, the event names, and id), rather than as
  one frozen MatchClaim object per claim; its columns are TimeToShare's
  MatchClaim table. Each anchor coordinate is a cell naming its own unit and
  number_type beside its number. In memory (table) the number keeps both
  sides, value and the exact numerator / denominator; the package form
  (package_table, the table to_parquet() writes) writes it once, in the member
  its number type names (an int as numerator alone, a fraction as numerator
  and denominator, a float as value alone), the others null, and
  from_package_table() reads that form back, refusing a cell that does not
  stand as its number type says and a null coordinate. A fraction is read in
  any terms (2/4 is the value 1/2), and a claim gives an end on both sides or
  on neither. Either way a claim's coordinate comes back in its axis's
  declared number type instead of being flattened on the way through the
  column. Individual MatchClaims are materialised on demand when a row is
  indexed or iterated. Built vectorized via from_columns(), it is the scalable
  backing for dense alignment matrices, where the complete pairwise topology
  of a whole work runs to roughly a million claims, and an AlignmentBundle
  keeps all its claims in one, match_claim_table. Shared provenance is held
  once at field level; only claims whose provenance differs carry it per row.
  The table property gives the field as an Arrow table, the shared provenance
  in its schema metadata under the key timetoshare:provenance, and
  from_table() reads it back unchanged; to_parquet() and from_parquet() write
  and read match_claims.parquet in the package form. An AlignmentBundle's
  to_file() writes its table there, beside the manifest, named in the
  manifest's resources, and from_file() reads it back; writing over an
  existing table keeps every claim it holds (the succession rule: same
  timelines, events and anchors, only the provenance may differ). to_dict()
  renders the same table as {"provenance": …, "rows": […]}, one mapping per
  claim keyed by the columns, and from_dict() reads it back.

MatchGraph: |
  An auxiliary structure formed by extending MatchClaims through shared
  coordinates; may be viewed as a hyperedge connecting multiple coordinates
  from different timelines. Connected components yield MatchStamps. Its edges
  are the anchors of the synchronous MatchClaims it was given (stated) and
  those extend_to_groups() infers through TimelineGroup membership
  (inferred_edges, each naming its group and the claim it comes from); an
  inferred edge is the graph's own, never a MatchClaim. filter() keeps the
  claims the unified filters choose (timeline_id and timeline_ids on either
  side, within both sides in the set, the belief filter, stated_only for no
  inferred edges) and rebuilds the graph from them, extended through the same
  groups. Each Match box M1–M15 in the Hendrix figure is a MatchGraph.

MatchLine: |
  An ordered sequence of AlignmentAnchors derived from MatchClaims, sorted by
  coordinate on a source timeline; input for WarpMap generation.

MatchStamp: |
  The union of TimeStamps from groups synchronously connected by a MatchGraph.
  Contains one coordinate per participating timeline. C-map conversion values
  are opt-in here: every matchstamp getter defaults to conversion_maps=False,
  unlike the TimeStamp getters, where conversions are shown by default —
  across a large bundle they would bury the alignment answer. MatchStamp
  implements the shared Stamp interface: get_coordinate_for(timeline_id)
  returns an IdCoordinate by default and a plain number under
  format="float"/"int"/"fraction", get_unit() converts through a C-map,
  get_conversion_for() reads label and structured map values,
  present_timelines lists available timelines, and is_interpolated identifies
  interpolation fallback. within= on a MatchStamp getter (and on
  MatchStamp.filter_by_timelines()) always keeps the queried timeline and
  selects among the others; on get_matchstamp_table() and a group's
  get_timestamp_table() it selects the table's columns; the MatchClaims the stamp is read from are chosen by the belief
  filter (believer=, beliefs=), and a stamp counts apart the timeline pairs a
  MatchClaim's anchor links and those an inferred edge links (n_stated_pairs,
  n_inferred_pairs).

MeasureConstituent: |
  A measure of a measure map that is only part of its nominal measure: an
  anacrusis, or one constituent of a split measure. It carries
  offset_within_measure, the strictly positive quarter-note position at which
  it begins inside the nominal measure. A measure is a constituent exactly when
  that offset is stated and non-zero; a shared measure number never marks a
  split measure. MeasureMapLoader reads a first row numbered 0 that is shorter
  than nominal as an anacrusis at offset nominal minus actual length.

MetricMap: |
  A table-based ConversionMap from a quarter position to its measure count,
  built from explicit measure-boundary anchors rather than a uniform measure
  length. Correctly handles anacrusis (incomplete first measure), irregular
  measures, varying time signatures, and repeat structure. Built directly from
  a Verovio timemap via MetricMap.from_verovio_timemap(). Not invertible (many
  quarters map to the same measure).

MetricalPositionMap: |
  A CombinationMap pairing a MetricMap with a beat-in-measure map to return a
  metrical position {mc, beat} from a quarter coordinate. Adds a reverse lookup
  quarters_at(mc, beat) (metrical position → quarters) and mn_at(quarters)
  (quarters → measure-number label). A TimeToShare manifest writes it as a
  MeasureBeatMap over the measure map its meter map describes, each measure's
  count standing as its number.

Minimal form: |
  The form in which every to_dict() writes a TimeToShare manifest by default
  (to_dict(minimal=False) writes the complete form): every key holding its
  default value is left out, except a timeline's length, which both forms
  write. Readers supply every default left out, so a minimal manifest can be
  written by hand; the smallest names the version and one timeline with its
  id, unit and length. to_file() writes a manifest file in the form it was
  read in, and in the minimal form and canonical YAML for an object not read
  from a file.

MpmLoader: |
  Loader for an MPM-Toolbox project: a sibling .msm score, .mpm modelled
  performance, and .mpr project file (carrying an observed audio-to-score
  alignment) for one work. Uses the standard two-step load() → create_*()
  pattern. Builds a shared logical "score" group holding the notes in two units
  — a ticks DiscreteLogicalTimeline (also carrying every MPM markup event:
  Tempo, Dynamics, Articulation, …) and a quarters ContinuousLogicalTimeline —
  with a TicksToQuarters map and a modelled quarters→seconds TableMap integrated
  from the performance's tempo markup; and a physical "perf" group of observed
  onsets in seconds and samples. Emits one synchronous cross-group MatchClaim
  per score note (the MSM xml:id ↔ MPR ref join is a bijection). Reads the
  modelled performance and the observed alignment; never runs an aligner.
  Returns an AlignmentBundle via create_bundle().

MultiMap: |
  An umbrella term for composed ConversionMaps: ChainMap (sequential),
  CombinationMap (parallel outputs), and ConcatenationMap (regional).

NOMATCH: |
  A sentinel value in a MatchClaim explicitly encoding the absence of a
  corresponding event on the other timeline. The MatchClaim records both
  timeline IDs and names the event of the timeline that has it, but has no
  AlignmentAnchors; is_synchronous is always False. Written NOMATCH_SENTINEL
  in the event ID column of the MatchClaim table; in code, the constant
  NOMATCH, which create_match_claims() takes as the side without an event.

Origin: "The zero coordinate of a timeline, from which all positions are measured."

Package: |
  A TimeToShare manifest and the tables its resources name. A manifest alone
  with its files beside it is a package of one manifest, which an
  AlignmentBundle's to_file() writes and from_file() reads. Several
  manifests share their tables in a folder whose package.yaml lists the
  manifests and the tables, each table a file or a folder of Parquet files
  holding the rows of one type of every manifest naming it. The Package
  class writes and opens such a folder: write_bundle(bundle, url) adds a
  bundle as the manifest at url (a new package stages it and to_file(path)
  writes every bundle staged, then package.yaml; a package on disk is
  written at once). The registry is the folder registry/ and the Extraction
  table the file tables/extractions.parquet; each write adds one file per
  pre-parsed table type and one of MatchClaims under tables/<Type>/, holding
  the rows of every bundle it writes, every event type included, and named
  from its content. from_file(path) opens a package, and
  bundle(url) reads one of its manifests with every table filtered to the
  timelines its resources list. In a package a timeline ID is held by one
  manifest, an event ID once among the events of every type, and a
  MatchClaim ID once among its MatchClaims; a collision is refused before
  anything is written. A manifest written again replaces the old one: its
  rows leave the files holding them, and its MatchClaims obey the
  succession rule. After each write the package is checked whole
  (timetoshare.tables.package_problems), and a problem is raised with every
  file restored.

PerformancePrecisionLoader: |
  Loader for audio-to-score alignment specimens: a directory bundling a .solo
  score, a Verovio timemap, and per-performer alignment files at the note, bar,
  and beat granularities. Uses the standard two-step load() → create_*()
  pattern. Resolves every "<measure>+<offset>" label to absolute quarters via a
  MetricMap, builds one logical score timeline (quarters) and one physical
  performance timeline per recording (seconds), and emits a MatchClaim per
  alignment row — synchronous for located onsets, NOMATCH for the dangling ones.
  Returns an AlignmentBundle via create_bundle().

ParangonadaLoader: |
  Loader for a parangonar parangonada export: per-performance CSV triples (score
  notes, performed notes, note-level correspondences) for one work. Uses the
  standard two-step load() → create_*() pattern. Parses the shared score once
  into two logical timelines (quarters and division-grid ticks, linked by a
  divs→quarters LinearMap), builds one performance group per recording with two
  physical timelines (seconds and samples, linked by a SamplesToSeconds map),
  and emits one cross-group MatchClaim per correspondence — synchronous for a
  matched note, NOMATCH for a score-only or performance-only note. Reads the
  existing alignment; never runs an aligner. Returns an AlignmentBundle via
  create_bundle().

Parent: |
  A timeline that contains one or more Child timelines. The parent and all
  its children must share the same measuring unit. Coordinate transfer uses
  exact offset arithmetic.

Pre-parsed table: |
  A Parquet table holding what is particular to the events of one type,
  keyed by their IDs and without positions: a Note's name, a Projection's
  projection_of, a Box's shape. An event's ID, type, timeline and position
  are its registry row, whose location names the table holding its content.
  Beside a lone manifest it is a file (Note.parquet; projections.parquet and
  boxes.parquet for Projections and Boxes); in a package it is the folder
  tables/<Type>/, shared by every manifest. An event whose content can be
  read again from its source file is re-parsed instead and has no row
  there. An AlignmentBundle's to_file() writes the tables of the Projections
  and Boxes its timelines hold, to_file(events=True) one for every other
  event type as well, and from_file() reads each event's content when its
  timeline's events are first read.

Projection: |
  An event standing on a timeline for an event that timeline does not hold,
  so that a MatchClaim can join two events: its ID (projection_ and 13 random
  characters when none is given), its position on the timeline's own axis (start, and a duration for
  a span), and projection_of, the event it stands for ({timeline_id,
  event_id}), or none where no such event is known: the source names an
  event the package does not hold, a NOMATCH is stated from a position, or a
  conceptual claim relates two positions. A synchronous claim between two
  positions adds no Projection: both its sides are CHUNK.
  Timeline.add_projections() adds Projections, reusing one the timeline
  already holds for the same event and position;
  AlignmentBundle.create_match_claims(), the alignment loaders and
  match_notes_by_attributes() give a Projection to every side stated as a
  position, except the CHUNK sides. A package holds every timeline's Projections as rows of the registry,
  which hold their positions, and in the Projection table
  (projections.parquet), the pre-parsed table of their IDs and
  projection_of; an AlignmentBundle's to_file() writes both beside the
  manifest whenever one of its timelines holds Projections, and from_file()
  reads them back onto the timelines. In memory a Projection's start and
  duration are coordinate cells, each naming its unit and number type; the
  registry writes them in the package form: the axis's unit and number_type
  once per row, each number once, in the member its number type names (see
  MatchClaimField). A
  Projection's ID is unique among all Projections of its manifest: a missing
  one is minted when the Projection is added, an ID another timeline's
  Projection already holds is refused, and no ID is ever renamed, since a
  MatchClaim may name it. Timelines given Projections apart and joined
  later may hold one ID twice; writing their package refuses it, naming both
  timelines.

Provenance: |
  How an item was made and who believes it, one facility for statements and
  MatchClaims. Every key is optional, but an entry states at least one: who
  stated the item, the day, how (manual, reconciled, imported, inferred or an
  IRI), the lookup service, the sources it rests on, how closely a value
  matches, a note, and beliefs: at most one per actor, "true", "false" or
  "unlikely", with its date. A person stating an item is recorded as
  believing it "true"; a loader or a service records how it made the item and
  believes nothing. A belief never removes an item. The belief filter reads
  one actor's beliefs: believer= names the actor, and beliefs= the states
  kept, any of four: "true", "undecided" (the believer holds no belief on the
  item), "unlikely" and "false"; the default keeps every state but "false",
  and without a believer nothing is filtered. Actors compare as the IRIs they
  stand for under the manifest's @context, so one believer may be spelled
  twice in one entry; the entry is then read as the most critical of that
  believer's beliefs ("false" before "unlikely" before "true"). For a
  statement, the entry sits in the provenance beside an element's statements
  (or inside a value node) and names the pair again by property and value; a
  pair without one is stated by the manifest's publisher, and a pair held
  only as its entry is a candidate. For a MatchClaim, the entry is the
  claim's provenance: create_match_claims(..., actor=) records the stating
  person's belief "true", and AlignmentBundle.add_match_claim_belief() records
  a belief in a claim the bundle holds.

Quadrilateral: |
  An area of an image bounded by four corners, each a Point (x, y), held in
  the order top_left, top_right, bottom_right, bottom_left (the order SVG
  polygons and IIIF selectors draw): it follows a measure of a scan whose
  sides are not upright. A Shape, as is BoundingBox. from_points() takes
  the corners in any order a source writes them, order= naming each one's
  role; from_svg_points() reads four SVG or MEI points starting at any
  corner and running either way. The corners held always run clockwise
  around a convex outline: from_points() refuses roles that do not, and
  points that bound no convex quadrilateral are refused, never reordered
  into one.

Reach: |
  The farthest coordinate on a timeline's own axis that its content reaches:
  the ends of its children (a child of unknown length contributing its offset
  plus its own reach), region ends, the coordinate of every flow-control
  element, the place of every destination stating a distance (by), and the
  end of the measure map. Events are not part of it. A
  timeline without such content reaches 0. The reach is independent of the
  length; displays use it as the extent of a timeline of unknown length.

Region: |
  A part of a timeline defined by a TimeInterval, identified by its element id
  and displayed by its name (e.g., "Chorus", "Verse"). Regions are not
  timelines and cannot hold events or maps directly.

Registry: |
  The Parquet table of every ID a TimeToShare manifest or a package
  resolves. An event's row states its ID, its type (kind), its timeline, its
  position on the axis of its timeline's root (start and, for a span,
  duration, with the axis's unit and number_type, each number once in the
  member its number type names), the extraction that made it with its
  locator in the source, and the location of the pre-parsed table holding
  its content. A non-event row names every element of the manifest, every
  MatchClaim and every extraction, with its kind and location. The registry
  holds no names. Beside it, the Extraction table has one row per run of a
  parser over a source file, or of a tool that made events without one. A
  manifest names the registry among its resources with the type Registry:
  beside a lone manifest it is registry.parquet, in a package the folder
  registry/ of non_events.parquet and one part per extraction.
  resolve(target, id) answers what an ID names, through a manifest or a
  package root, always as a list.

Resource: |
  An entry of a TimeToShare manifest's resources, naming a file, or a folder
  of Parquet files read as one table, that holds data for its timelines: its
  id (any element id no other element of the manifest holds; an entry the
  library adds gets a minted resource_…, and an entry read keeps its own
  when written back), its type (what its rows are: MatchClaim for the
  MatchClaim table, or Registry for the registry, whose rows point to the
  pre-parsed tables, which no resource names), the ids of the timelines it holds
  data for, its url relative to the manifest (a folder when it ends in /),
  and optionally its media type, size in bytes and integrity (an Integrity:
  algorithm and digest; a file's only). A manifest may name several
  resources of one type, each listing other timelines. Resource.is_table
  tells a table resource from a resource carried with the manifest, such as
  a recording. A manifest and the files it names make a package; the
  manifest reads and draws without them, and names no event. An
  AlignmentBundle keeps the entries as Resource objects in its resources;
  from_file() reads every table resource holding events or MatchClaims: a
  file whole, a folder keeping the rows of the timelines the resource lists,
  since the files of a folder may hold the rows of other manifests of a
  package; a table of other rows, and a folder holding no Parquet file, is
  carried as it stands. Its to_file() writes the MatchClaim table when it
  holds MatchClaims, and the registry, the Extraction table and a
  pre-parsed table per type for the Projections and Boxes its timelines
  hold, and with events=True for every other event type its timelines hold
  as well. It refuses, with a
  NotImplementedError, to write rows of a type whose resource names a
  folder: the files of a folder are shared by a package's manifests, and
  Package.write_bundle() writes into them. A named file or folder that is
  absent is not read and its entry is kept.

raw_quarters: |
  The conventional name for the ShiftMap attached to a score timeline. The
  timeline stores normalised (non-negative) coordinates — shifted so the
  minimum onset is 0.0 — and this map converts them back to the raw quarter
  values of the source. Its offset equals min(raw_onsets). Added by
  MatchfileLoader and PartituraLoader so downstream code can detect and apply
  the same shift when comparing coordinates across loaders.

Root: |
  The top-level timeline in a hierarchy of nested timelines. No parent bounds
  its length; an unlocked descendant grows within its parent's length, or
  grows an unlocked parent with it.

RotationMap: |
  A periodic ConversionMap that wraps coordinates cyclically. Used for
  modelling repeating patterns such as an ostinato whose local structure
  recurs while the parent timeline advances.

ScoreNote: |
  A note or rest of a score: a Note written on a staff and in a voice. staff
  and voice are the source's numbers (an MEI <staff> and <layer>, a MuseScore
  staff and voice); a performance states neither, so a Note has no staff and
  no voice. Every other member, the pitch among them, is the Note's. The score
  loaders write their notes as rows of event type Note; get_field(ScoreNote)
  on such rows reads them back as ScoreNotes where the table states an
  integer staff and voice, and get_field(Note) reads the same rows as Notes.

SectionBreak: |
  A flow-control element where a section ends (a movement, a section of a
  piece); the flow goes on across it. A destination without place goes on at
  the nearest SectionBreak before its Jump, and a flow ended by a Break begins
  again at the next one.

Segment: |
  A Child timeline that is contiguous with its siblings. Segments enable
  concatenation of local coordinate systems.

SegmentLine: |
  A runtime class parameterized by its segment class, such as
  SegmentLine[DiscreteGraphicalTimeline], whose contiguous Segments tile its
  full length. A line is also an instance of that segment class. Any timeline
  can check this structure with the property is_segment_line and adopt
  enforcement with as_segment_line(); a line returns to an unenforced timeline
  with to_timeline(). create_children_from_boundaries() creates
  boundary-driven tilings. Appending extends an unlocked line, while appending to a locked
  line raises RuntimeError.

StartAnchor: "The first AlignmentAnchor of a synchronous MatchClaim, derived from the start coordinates."

StartInstant: |
  An Instant marking the start of a TimeInterval. Implies the presence of a
  corresponding EndInstant with coordinate >= StartInstant's coordinate.

Statement: |
  A property-value pair saying what an element of a manifest stands for or
  how that thing relates to others. The manifest (the bundle), which names the
  work it is about by schema:about, every timeline at any depth, for the
  manifestation it is the axis of, and every region, for the stretch it marks,
  carry statements; a group carries none, and works and expressions are
  values, never elements. The property is type ("is a") or an IRI, compact
  with a prefix of the manifest's inline @context or absolute; the value is a
  literal, a value object, a node (a thing with its own pairs) or an ordered
  list. A value naming an element is its reference, {id: "#cpt_1"}.
  Statements never nest, order or align timelines.

SupportPolicy: |
  How a cross-timeline MatchStamp treats a timeline whose transferred coordinate
  falls outside alignment support — the entering coordinate lies beyond the
  transferring WarpMap's anchor hull, or the produced coordinate would fall
  outside the target timeline's [0, length] span. omit (the default) drops that
  timeline; clamp reports the nearest in-support boundary coordinate;
  extrapolate keeps the linear extrapolation clipped to [0, length]. No policy
  ever yields a negative coordinate, and the queried timeline's own coordinate
  is never altered. Set per call via
  AlignmentBundle.get_matchstamp_at(..., support_policy=...) or persistently via
  AlignmentBundle.support_policy.

Synchrony: |
  Strict synchrony: Instants sharing identical coordinates. Pragmatic synchrony:
  Instants binned together based on a threshold (e.g., for quantisation).

Table resource: |
  A resource of a TimeToShare manifest that names a table, by the format's
  one rule (timetoshare.tables.is_table_resource, which Resource.is_table
  asks): its type is MatchClaim or Projection, its url names a folder (ends
  in /) or a Parquet file (ends in .parquet), or its media type is
  application/vnd.apache.parquet. In a package each names a table of
  package.yaml of its type; any other resource (a recording, an image, a
  score file) is carried with its manifest. An AlignmentBundle reads a table
  resource into its timelines where it holds events (the columns id,
  timeline_id, unit, number_type and start) or MatchClaims; a table of other
  rows is carried as it stands.

Time path: |
  The line a reader follows through an image (TimeAxisPath). No image has a
  time axis until its path is defined: a timeline of an image runs along
  the path and is as long as it. A path converts between its coordinate and
  the image's (x, y) with to_2d() and from_2d(). HorizontalLinePath,
  VerticalLinePath, DiagonalLinePath and ParametricPath are single lines; a
  PiecewisePath is made of consecutive pieces, such as the accolades of a
  page, each starting where the ones before it end.
  TimeAxisPath.from_boxes() makes the path of a page from the areas drawn
  on it. DmosLoader and MeiFacsimileLoader make the paths of their pages
  (create_paths()); IIIFManifestLoader is given the path of each canvas.

TimelineGroup: |
  An array of member timelines that share the same graphical start and end:
  every member's 0 coincides with every other member's 0, and every member's
  length with every other member's length. Placing timelines in a group
  asserts commensurability regardless of their units. A position in between
  converts linearly and exactly (p on member A is p · len_B / len_A on member
  B) and is written in the target member's number type. When only part of a
  timeline takes part, the member is a child of that timeline at its exact
  offset; a member is never placed partially. No member is an ancestor or a
  descendant of another member of the same group, since a child sits at its
  offset inside its parent. A group answers with the same TimeStamp class as a
  Timeline; to_dict() and from_dict() write and read it with every timeline it
  needs.

TimeInterval: |
  Defined by a StartInstant and EndInstant; left-inclusive and right-exclusive
  [s, e). The EndInstant's coordinate must be >= the StartInstant's.

TimeIntervalEvent: |
  An event with duration, defined by a TimeInterval (start and end coordinates).
  Contrast with InstantEvent which has zero duration.

TimeIntervalStamp: |
  Combination of a start TimeStamp and an end TimeStamp, representing a
  cross-section of an interval through the timeline hierarchy. It stores one
  Interval per timeline ID; get_interval(timeline_id) returns that Interval,
  get_intervals() the whole mapping, get_duration_for() an IdDuration, and
  get_interval_in(unit) the span converted through a C-map. Interval retrieval
  takes no format argument — its scalar leaf is always an Interval.

Timeline: |
  A positive coordinate axis defined by an origin and a measuring unit;
  continuous (real) or discrete (integer). Accommodates events and potentially
  Child timelines.

TimeStamp: |
  A cross-section through a timeline or group at a given coordinate, capturing
  positions in all connected systems plus values converted by all attached
  C-maps. It stores one Coordinate per timeline ID, so each entry carries its
  own unit and number type. TimeStamp implements the Stamp interface
  it shares with MatchStamp: a typed axis, get_coordinate_for()
  and get_coordinates_for() returning IdCoordinates by default, get_unit() for
  unit conversion, get_conversion_for() for label and structured map values,
  present_timelines, and is_interpolated. A bare number is an explicit
  format="float"/"int"/"fraction" request; there is no ambient float view.
  Which children answer follows the containment rule of Child.

TimeToShare manifest: |
  The file format in which timelines, groups and bundles are exchanged,
  written in canonical YAML, or optionally in pretty JSON or RFC 8785 JSON,
  one shape for all: the version marker "timetoshare", an array of root
  timelines, and optionally the manifest's id, name and meta, its groups, its
  measure maps, its resources (the files beside it, such as the MatchClaim
  table), its @context, statements and provenance and its
  graphical (display order and styling). A single timeline is a manifest
  of one root, a group a manifest with one group; a manifest with an id or a
  name is named. Every manifest is an alignment bundle, also one holding one
  timeline or one group, and a manifest with neither an id nor a name is an
  anonymous bundle. A value on a timeline's own axis (length, a child's offset,
  region bounds, flow-control coordinates) is written bare, in the axis's
  number type. Timeline, TimelineGroup and AlignmentBundle write one with
  to_dict() and read one with from_dict(), and write and read a manifest
  file with to_file() and from_file().

Unknown key: |
  A key of a TimeToShare manifest that the format does not define, written
  by another application for its own use. The library keeps every unknown key
  on the object read from the JSON object it was found in and writes it back
  in place.

Unknown length: |
  A timeline length of None (null in a manifest), stating that the length is
  not known. It is a fact, never inferred from content, and any timeline may
  have it: root, child, locked, group member or segment. Positions on such a
  timeline are not bounded above; an operation that needs the end raises
  UnknownLengthError. Setting a length to or from None is an ordinary edit.

UnknownLengthError: |
  The ValueError raised by an operation that needs the end of a timeline whose
  length is unknown, before it changes anything. Its message names the
  operation and the timeline; group conversion to or from such a member and
  appending a child at such a parent's end are examples.

Virtual timeline: |
  The statement that a map was applied to a timeline, giving a timeline with
  an element id, a unit, a number type and a length of its own and nothing
  else: no events, no children, no flow control. Applied, a FlowMap gives its
  root's played order as a virtual timeline, and positions convert through it
  in both directions (unfold, fold). Timeline.create_virtual_timeline() states
  one; a manifest lists them in virtual_timelines.

WarpMap: |
  An interpolation-based coordinate mapping derived from a MatchLine; enables
  non-linear coordinate transfer between TimelineGroups. It declares both axes
  — source and target unit and number type — and is queried through
  get_coordinate_at(position) for one position or get_coordinates_at([...])
  for a batch; the object is not callable and exposes no raw arrays.
  inverse() returns a WarpMap with both units and both number types swapped.
