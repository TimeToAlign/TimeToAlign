# TimeToAlign! Glossary of Terms
# Alphabetical listing of model terminology
# Last updated: 2026-02-28 — Harmonized with TISMIR manuscript glossary table;
# added FlowMap, aligned all definitions with article.

AlignmentAnchor: |
  A coordinate pair associating one coordinate on timeline A with one on
  timeline B; a neutral record with no claim semantics. Provenance and
  interpretation are carried by the enclosing MatchClaim. Only synchronous
  MatchClaims produce AlignmentAnchors.

AlignmentBundle: |
  A collection of TimelineGroups with inter-group MatchClaim connections;
  provides coordinate transfer via offset arithmetic, interpolation, and
  WarpMaps.

AlignmentMatrix: |
  An audio-to-audio alignment in which several recordings of one work are each
  warped onto a single shared, equidistant reference grid. Per recording, a
  parallel onset-time array gives that recording's clock-time at each grid
  column; because every array indexes the same grid they are equal length, so
  together they form a dense matrix of shape (recordings × grid columns). A
  single such file encodes an entire MatchGraph directly — every pair of
  recordings is related at every grid column — rather than only one
  score-to-performance correspondence. Read by ListenHereLoader, with the
  complete pairwise claim set held in a MatchClaimField.

BeatGrid: |
  An ordered set of BeatGridSegments and the beats they generate on a seconds
  axis. Each segment states one stretch of a recording — an anchor instant, a
  tempo, a BeatPolicy, and which beat of a bar the anchor is — and generates
  beats without end; the grid orders the segments, bounds each by its
  successor's start and the last by its extent, and labels the resulting beats
  with measure and beat numbers. A BeatGrid is not a Timeline and stores
  nothing per beat.

BeatPolicy: |
  How one bar is counted in beats: a grouping cycle over one counted note
  value. A 4/4 bar is four beats of a quarter, a compound 6/8 bar two beats of
  three eighths, an uneven (3+2+3)/8 bar three beats of unequal length. Beat
  lengths are derived from the grouping and the division, never stored. One
  signature admits more than one counting: a BeatGrid's lattice reads 6/8 as
  six beats of an eighth, because its beat-in-bar index counts the notated
  value rather than the felt pulse.

Break: |
  A control event that voids contiguity at its Instant. TimeIntervals cannot span
  a Break, and Breaks cannot be inserted into existing TimeIntervals.

ChainMap: |
  A MultiMap that applies multiple ConversionMaps in sequence, creating a conversion
  path from source to target unit.

Child: |
  A timeline nested within a parent, sharing its measuring unit but defining
  its own origin. Coordinate transfer between parent and child uses exact offset
  arithmetic, applied recursively. add_child() locks a child by default; an
  unlocked child may grow, contained by its parent like any content.

ClaimType: |
  The semantic kind of a MatchClaim, derived from its structure rather than
  stored: read from whether the claim is explicit, whether it is synchronous,
  and how many of its two sides name an event. Six members: event_match
  (synchronous, both sides name an event — the case that yields
  AlignmentAnchors), projection (synchronous, exactly one side names an event,
  the other a bare coordinate), anchor (synchronous, neither side names an
  event — two anonymous coordinates), nomatch (non-synchronous, exactly one
  side names an event whose counterpart is absent — see NOMATCH), conceptual
  (non-synchronous, neither or both sides name an event — a structural
  correspondence with no temporal commitment), and implicit (inferred by graph
  extension; overrides all the above).

CombinationMap: |
  A MultiMap yielding outputs from multiple ConversionMaps simultaneously
  (e.g., (x, y) coordinate pairs).

Commensurability: |
  Two timelines are commensurable if connected by a chain of C-maps, membership
  in the same TimelineGroup, or cross-group MatchClaims, enabling coordinate
  translation between them.

Commensurable: |
  See Commensurability.

Complete form: |
  The form in which to_dict() writes a TimeToShare manifest by default: every
  key the format defines is written, those holding their default value
  included (null, {}, []). A key whose default is its absence, such as a
  manifest's id or a root timeline's offset, is written only when it has a
  value. The complete and the minimal form of one object read back to equal
  objects, and each writes back to itself.

ConcatenationMap: |
  A MultiMap combining bounded ConversionMaps such that each coordinate region is
  handled by a specific map. Also called PiecewiseMap.

Contiguity: |
  A TimeInterval is contiguous if it monotonically spans all coordinates between
  its start and end. An Instant is contiguous with a TimeInterval if it is
  synchronous with its EndInstant.

ControlEvent: |
  An event affecting flow control: either a Break (voiding contiguity) or a Jump
  (creating new contiguity).

ConversionMap: |
  A typed function attached to a timeline that maps each coordinate to exactly
  one value (coordinate, label, or filename); also permits inverse conversion
  back to the timeline's own unit. Also called C-map.

Coordinate: |
  A position on a timeline, expressed as the distance from the origin in the
  timeline's measuring unit. Combines a numeric value with a TimeUnit. The unit
  alone decides the number policy: quarters and beats are exact Fractions,
  discrete units (ticks, samples, frames, pixels) are locked to int, and the
  remaining continuous units (seconds, points, centimeters, …) are float. That
  declared number type is preserved at every boundary — authored, converted,
  interpolated, queried or retrieved — so a fraction-canonical axis always
  yields Fractions and a float-canonical axis always yields floats. An explicit
  number_type= overrides the default, and exact input is never degraded.

Flow: |
  One computed path through a score's control structure — the ordered sequence
  of measure visitations that results from following its repeats, jumps and
  voltas. A ScoreFlowController computes one from the parsed measure records,
  or one can be loaded from a .flow.csv ground truth and compared with
  is_equivalent(). A Flow is section-based; measure-count ranges follow the
  library's right-open [start, end) convention. It is the input a FlowMap is
  built from, not itself a mapping between coordinates.

FlowMap: |
  A path through a score's control structure (repeats, jumps), expressed as an
  ordered sequence of TimeIntervals; not itself a timeline. Used for unfolding a
  score into performance order. A FlowMap is built from one uniform argument —
  a single interval-like value (a Region, a coordinate pair, a Timeline, or an
  interval event) or an iterable of them, which concatenate in performance
  order — or from a score's computed flow of Breaks and Jumps.
  Timeline.create_flow_map(intervals) resolves region names against the
  timeline's own Regions, attaches the FlowMap, and returns it.

DictStore: |
  A generic EventStore subclass holding a dict[str, EventData] with arbitrary
  keys. Used internally by AlignmentLoaders to store one EventData table per
  timeline-to-be (e.g., "score", "perf:p01", "perf:p02"). Maintains the
  uniform EventStore interface (iteration, keys, items, getitem).

Discrete: |
  A timeline is discrete when coordinates exist only at discrete points
  (e.g., pixels, samples, ticks). Contrast with Continuous timelines where
  coordinates can take any real value (e.g., seconds, quarters).

Domain: |
  One of three temporal categories: Graphical (visual/spatial), Logical
  (symbolic/musical), or Physical (audio/sound). Each domain has both
  discrete and continuous timeline variants.

element id: |
  The id that identifies a timeline, ConversionMap, Region, Break, Jump or
  Marker. It is unique within one timeline tree (a root timeline and all its
  descendants) across every kind, so the id alone names the element. An id is
  whatever was given and is kept verbatim: any non-empty string without "/"
  and without a control character; spaces, colons and dots are allowed. Only
  an element given no id gets a minted one, {prefix}_{N} with N the smallest
  positive integer not yet taken in the tree. The prefix names the kind: clt,
  dlt, cpt, dpt, cgt or dgt for a timeline (continuous or discrete, logical,
  physical or graphical), cmap, lmap, tmap or pmap for a conversion map, and
  region, break, jump or marker; a loader role leads it (score:clt_1).
  A minted id that collides when its element joins a tree is re-minted; a
  given id that collides raises. The id identifies, the name displays: a name
  may be absent or repeat, and an id is never derived from it.

EndAnchor: "The second AlignmentAnchor of a synchronous interval MatchClaim, derived from the end coordinates."

EndInstant: |
  An Instant marking the end of a TimeInterval. Implies the presence of a
  corresponding StartInstant with coordinate <= EndInstant's coordinate.

Event: |
  Anything associated with a timeline via Instants. An InstantEvent has zero
  duration; a TimeIntervalEvent has duration defined by start and end coordinates.

IdCoordinate: |
  A Coordinate that also names the timeline it belongs to. It is the default
  return of every coordinate getter in the library — stamps, timelines, groups,
  bundles, match lines, graphs and warp maps all hand back
  IdCoordinate(value, unit, timeline_id) unless an explicit format= asks for
  something else. Carrying identity is what lets a retrieved coordinate be
  handed straight back as a query without restating which axis it came from.
  IdCoordinate never compares equal to a plain Coordinate in either direction;
  use format="coordinate" when timeline identity should be discarded.

Instant: |
  Associates a coordinate (a "time-point") with a signification such as
  "start of event e". Instants sharing a coordinate are synchronous.

InstantEvent: |
  An event defined by a single Instant, having zero duration. Contrast with
  TimeIntervalEvent which has a duration.

Interval: |
  A frozen scalar pairing two plain Coordinates as a half-open span
  [start, end): the start is inclusive, the end exclusive. Both endpoints must
  share one TimeUnit and one number type, which makes the interval's own unit
  and number_type unambiguous; its duration is exactly end - start, returned as
  a Duration. Reversed intervals raise; zero-length ones are valid. It renders
  through the same formatter the scalars use, so
  str(Interval(Coordinate(Fraction(1, 2), quarters),
  Coordinate(Fraction(3, 2), quarters))) is "[1/2, 3/2) quarters". Interval is
  the scalar leaf of interval retrieval: TimeIntervalStamp.get_interval() and
  TimelineGroup.get_interval_for() both return one.

IntervalField: |
  The SemanticField paired with Interval. It stores a struct of start and end
  coordinate structs under one unit, domain, and number_type metadata triple,
  materialises Interval | None per row, and exposes vectorized start, end, and
  duration accessors returning CoordinateField, CoordinateField, and
  DurationField.

InverseMap: "The reverse transformation of a bijective ConversionMap."

Jump: |
  A control event with JumpFrom and JumpTo Instants. When active, makes events
  at JumpTo contiguous with those ending at JumpFrom (e.g., repeats, dal segno).
  Its target is the element id of a Marker of the same timeline (a segno, a
  coda), or None when it lands on no marker (to the start, a plain repeat);
  JumpTo carries the destination coordinate either way.

JumpFrom: "The originating Instant of a Jump control event."

JumpTo: "The destination Instant of a Jump control event."

Length: |
  The distance between a timeline's origin and its last Instant, or None when
  it is not known (see Unknown length). A locked timeline cannot extend its
  length.

Locked: |
  A timeline state that fixes its coordinate axis: no Instants may be added
  after the last time-point, so its length cannot change. Locking governs the
  coordinate axis only — non-structural annotations such as Regions may still be
  added to a locked timeline. A timeline is locked with locked=True, when
  add_child() embeds it with its default locked=True, or after construction
  with lock(); a child read from a manifest keeps the manifest's locked. A
  lock cannot be lifted. A locked timeline's length may still be unknown.

Marker: |
  A named position in a timeline's flow control that a Jump can target, such
  as a segno or a coda sign. A Marker carries an element id, an optional
  name, and a coordinate; a Jump refers to it by its id, never by its name.

MatchfileLoader: |
  Loader for Vienna Match (.match) alignment files. Uses the standard two-step
  load() → create_*() pattern. A single instance processes all .match files that
  share the same score, building a shared score timeline on the first file and
  verifying subsequent files against it. Returns an AlignmentBundle directly via
  create_alignment_bundle(). Score goes into its own group; performances are
  standalone timelines; MatchClaims connect score to performances.

MatchClaim: |
  A claim of equivalence between events on different timelines, with provenance
  metadata (the authoring agent and a certainty). May be synchronous (producing
  AlignmentAnchors) or conceptual (structural equivalence without temporal
  commitment). Always knows which pair of timelines it connects. Four cases:
  (a) event-to-event, (b) projection, (c) NOMATCH, (d) implicit (from group
  extension). Held individually, or columnar at scale in a MatchClaimField.

MatchClaimField: |
  A columnar, PyArrow-backed store holding a whole set of synchronous-instant
  pairwise MatchClaims as Arrow columns (the two timeline ids dictionary-encoded,
  each coordinate as a struct of value, numerator, denominator and unit) rather
  than as one frozen MatchClaim object per claim. Storing the exact ratio beside
  the float mirror is what lets a claim's coordinate come back in its axis's
  declared number type instead of being flattened on the way through the column. Individual MatchClaims are materialised on demand when a row is indexed
  or iterated. Built vectorized via from_columns(), it is the scalable backing
  for dense alignment matrices, where the complete pairwise topology of a whole
  work runs to roughly a million claims. Shared provenance is held once at field
  level, never per row.

MatchGraph: |
  An auxiliary structure formed by extending MatchClaims through shared
  coordinates; may be viewed as a hyperedge connecting multiple coordinates
  from different timelines. Connected components yield MatchStamps. Each
  Match box M1–M15 in the Hendrix figure is a MatchGraph.

MatchLine: |
  An ordered sequence of AlignmentAnchors derived from MatchClaims, sorted by
  coordinate on a source timeline; input for WarpMap generation.

MatchStamp: |
  The union of TimeStamps from groups synchronously connected by a MatchGraph.
  Contains one coordinate per participating timeline. C-map conversion values
  are opt-in here: every matchstamp getter defaults to conversion_maps=False,
  unlike the TimeStamp getters, where conversions are shown by default —
  across a large bundle they would bury the alignment answer. MatchStamp
  implements the shared Stamp interface: get_coordinate_for(timeline_id)
  returns an IdCoordinate by default and a plain number under
  format="float"/"int"/"fraction", get_unit() converts through a C-map,
  get_conversion_for() reads label and structured map values,
  present_timelines lists available timelines, and is_interpolated identifies
  interpolation fallback.

MeasureConstituent: |
  A measure of a measure map that is only part of its nominal measure: an
  anacrusis, or one constituent of a split measure. It carries
  offset_within_measure, the strictly positive quarter-note position at which
  it begins inside the nominal measure. A measure is a constituent exactly when
  that offset is stated and non-zero; a shared measure number never marks a
  split measure. MeasureMapLoader reads a first row numbered 0 that is shorter
  than nominal as an anacrusis at offset nominal minus actual length.

MetricMap: |
  A table-based ConversionMap from a quarter position to its measure count,
  built from explicit measure-boundary anchors rather than a uniform measure
  length. Correctly handles anacrusis (incomplete first measure), irregular
  measures, varying time signatures, and repeat structure. Built directly from
  a Verovio timemap via MetricMap.from_verovio_timemap(). Not invertible (many
  quarters map to the same measure).

MetricalPositionMap: |
  A CombinationMap pairing a MetricMap with a beat-in-measure map to return a
  metrical position {mc, beat} from a quarter coordinate. Adds a reverse lookup
  quarters_at(mc, beat) (metrical position → quarters) and mn_at(quarters)
  (quarters → measure-number label). A TimeToShare manifest writes it as a
  MeasureBeatMap over the measure map its meter map describes, each measure's
  count standing as its number.

Minimal form: |
  The form in which to_dict(minimal=True) writes a TimeToShare manifest:
  every key holding its default value is left out, except a timeline's
  length, which both forms write. Readers supply every default left out, so a
  minimal manifest can be written by hand; the smallest names the version and
  one timeline with its id, unit and length.

MpmLoader: |
  Loader for an MPM-Toolbox project: a sibling .msm score, .mpm modelled
  performance, and .mpr project file (carrying an observed audio-to-score
  alignment) for one work. Uses the standard two-step load() → create_*()
  pattern. Builds a shared logical "score" group holding the notes in two units
  — a ticks DiscreteLogicalTimeline (also carrying every MPM markup event:
  Tempo, Dynamics, Articulation, …) and a quarters ContinuousLogicalTimeline —
  with a TicksToQuarters map and a modelled quarters→seconds TableMap integrated
  from the performance's tempo markup; and a physical "perf" group of observed
  onsets in seconds and samples. Emits one synchronous cross-group MatchClaim
  per score note (the MSM xml:id ↔ MPR ref join is a bijection). Reads the
  modelled performance and the observed alignment; never runs an aligner.
  Returns an AlignmentBundle via create_bundle().

MultiMap: |
  An umbrella term for composed ConversionMaps: ChainMap (sequential),
  CombinationMap (parallel outputs), and ConcatenationMap (regional).

NOMATCH: |
  A sentinel value in a MatchClaim explicitly encoding the absence of a
  corresponding event on the other timeline. The MatchClaim records both
  timeline IDs but has no AlignmentAnchors; is_synchronous is always False.

Origin: "The zero coordinate of a timeline, from which all positions are measured."

PerformancePrecisionLoader: |
  Loader for audio-to-score alignment specimens: a directory bundling a .solo
  score, a Verovio timemap, and per-performer alignment files at the note, bar,
  and beat granularities. Uses the standard two-step load() → create_*()
  pattern. Resolves every "<measure>+<offset>" label to absolute quarters via a
  MetricMap, builds one logical score timeline (quarters) and one physical
  performance timeline per recording (seconds), and emits a MatchClaim per
  alignment row — synchronous for located onsets, NOMATCH for the dangling ones.
  Returns an AlignmentBundle via create_bundle().

ParangonadaLoader: |
  Loader for a parangonar parangonada export: per-performance CSV triples (score
  notes, performed notes, note-level correspondences) for one work. Uses the
  standard two-step load() → create_*() pattern. Parses the shared score once
  into two logical timelines (quarters and division-grid ticks, linked by a
  divs→quarters LinearMap), builds one performance group per recording with two
  physical timelines (seconds and samples, linked by a SamplesToSeconds map),
  and emits one cross-group MatchClaim per correspondence — synchronous for a
  matched note, NOMATCH for a score-only or performance-only note. Reads the
  existing alignment; never runs an aligner. Returns an AlignmentBundle via
  create_bundle().

Parent: |
  A timeline that contains one or more Child timelines. The parent and all
  its children must share the same measuring unit. Coordinate transfer uses
  exact offset arithmetic.

Reach: |
  The farthest coordinate on a timeline's own axis that its content reaches:
  the ends of its children (a child of unknown length contributing its offset
  plus its own reach), region ends, break and marker coordinates, both ends of
  every jump, and the end of the measure map. Events are not part of it. A
  timeline without such content reaches 0. The reach is independent of the
  length; displays use it as the extent of a timeline of unknown length.

Region: |
  A part of a timeline defined by a TimeInterval, identified by its element id
  and displayed by its name (e.g., "Chorus", "Verse"). Regions are not
  timelines and cannot hold events or maps directly.

raw_quarters: |
  The conventional name for the ShiftMap attached to a score timeline. The
  timeline stores normalised (non-negative) coordinates — shifted so the
  minimum onset is 0.0 — and this map converts them back to the raw quarter
  values of the source. Its offset equals min(raw_onsets). Added by
  MatchfileLoader and PartituraLoader so downstream code can detect and apply
  the same shift when comparing coordinates across loaders.

Root: |
  The top-level timeline in a hierarchy of nested timelines. No parent bounds
  its length; an unlocked descendant grows within its parent's length, or
  grows an unlocked parent with it.

RotationMap: |
  A periodic ConversionMap that wraps coordinates cyclically. Used for
  modelling repeating patterns such as an ostinato whose local structure
  recurs while the parent timeline advances.

Segment: |
  A Child timeline that is contiguous with its siblings. Segments enable
  concatenation of local coordinate systems.

SegmentLine: |
  A runtime class parameterized by its segment class, such as
  SegmentLine[DiscreteGraphicalTimeline], whose contiguous Segments tile its
  full length. A line is also an instance of that segment class. Any timeline
  can check this structure with is_segment_line() and adopt enforcement with
  as_segment_line(); a line returns to an unenforced timeline with
  to_timeline(). create_children_from_boundaries() creates boundary-driven
  tilings. Appending extends an unlocked line, while appending to a locked
  line raises RuntimeError.

StartAnchor: "The first AlignmentAnchor of a synchronous MatchClaim, derived from the start coordinates."

StartInstant: |
  An Instant marking the start of a TimeInterval. Implies the presence of a
  corresponding EndInstant with coordinate >= StartInstant's coordinate.

SupportPolicy: |
  How a cross-timeline MatchStamp treats a timeline whose transferred coordinate
  falls outside alignment support — the entering coordinate lies beyond the
  transferring WarpMap's anchor hull, or the produced coordinate would fall
  outside the target timeline's [0, length] span. omit (the default) drops that
  timeline; clamp reports the nearest in-support boundary coordinate;
  extrapolate keeps the linear extrapolation clipped to [0, length]. No policy
  ever yields a negative coordinate, and the queried timeline's own coordinate
  is never altered. Set per call via
  AlignmentBundle.get_matchstamp_at(..., support_policy=...) or persistently via
  AlignmentBundle.support_policy.

Synchrony: |
  Strict synchrony: Instants sharing identical coordinates. Pragmatic synchrony:
  Instants binned together based on a threshold (e.g., for quantisation).

TimelineGroup: |
  An array of member timelines that share the same graphical start and end:
  every member's 0 coincides with every other member's 0, and every member's
  length with every other member's length. Placing timelines in a group
  asserts commensurability regardless of their units. A position in between
  converts linearly and exactly (p on member A is p · len_B / len_A on member
  B) and is written in the target member's number type. When only part of a
  timeline takes part, the member is a child of that timeline at its exact
  offset; a member is never placed partially. No member is an ancestor or a
  descendant of another member of the same group, since a child sits at its
  offset inside its parent. A group answers with the same TimeStamp class as a
  Timeline; to_dict() and from_dict() write and read it with every timeline it
  needs.

TimeInterval: |
  Defined by a StartInstant and EndInstant; left-inclusive and right-exclusive
  [s, e). The EndInstant's coordinate must be >= the StartInstant's.

TimeIntervalEvent: |
  An event with duration, defined by a TimeInterval (start and end coordinates).
  Contrast with InstantEvent which has zero duration.

TimeIntervalStamp: |
  Combination of a start TimeStamp and an end TimeStamp, representing a
  cross-section of an interval through the timeline hierarchy. It stores one
  Interval per timeline ID; get_interval(timeline_id) returns that Interval,
  get_intervals() the whole mapping, get_duration_for() an IdDuration, and
  get_interval_in(unit) the span converted through a C-map. Interval retrieval
  takes no format argument — its scalar leaf is always an Interval.

Timeline: |
  A positive coordinate axis defined by an origin and a measuring unit;
  continuous (real) or discrete (integer). Accommodates events and potentially
  Child timelines.

TimeStamp: |
  A cross-section through a timeline or group at a given coordinate, capturing
  positions in all connected systems plus values converted by all attached
  C-maps. It stores one Coordinate per timeline ID, so each entry carries its
  own unit and number type. TimeStamp implements the Stamp interface
  it shares with MatchStamp: a typed axis, get_coordinate_for()
  and get_coordinates_for() returning IdCoordinates by default, get_unit() for
  unit conversion, get_conversion_for() for label and structured map values,
  present_timelines, and is_interpolated. A bare number is an explicit
  format="float"/"int"/"fraction" request; there is no ambient float view.

TimeToShare manifest: |
  The JSON file format in which timelines, groups and bundles are exchanged,
  one shape for all: the version marker "timetoshare", an array of root
  timelines, and optionally the manifest's id, name and meta, its groups, its
  measure maps and its graphical (display order and styling). A single timeline is a manifest
  of one root, a group a manifest with one group; a manifest with an id or a
  name is named. Every manifest is an alignment bundle, also one holding one
  timeline or one group, and a manifest with neither an id nor a name is an
  anonymous bundle. A value on a timeline's own axis (length, a child's offset,
  region bounds, flow-control coordinates) is written bare, in the axis's
  number type. Timeline, TimelineGroup and AlignmentBundle write one with
  to_dict() and read one with from_dict(). The library class TimeSkeleton is
  a different thing: a temporal structure shared by the timelines of one work.

Unknown key: |
  A key of a TimeToShare manifest that the format does not define, written
  by another application for its own use. The library keeps every unknown key
  on the object read from the JSON object it was found in and writes it back
  in place.

Unknown length: |
  A timeline length of None (null in a manifest), stating that the length is
  not known. It is a fact, never inferred from content, and any timeline may
  have it: root, child, locked, group member or segment. Positions on such a
  timeline are not bounded above; an operation that needs the end raises
  UnknownLengthError. Setting a length to or from None is an ordinary edit.

UnknownLengthError: |
  The ValueError raised by an operation that needs the end of a timeline whose
  length is unknown, before it changes anything. Its message names the
  operation and the timeline; group conversion to or from such a member and
  appending a child at such a parent's end are examples.

WarpMap: |
  An interpolation-based coordinate mapping derived from a MatchLine; enables
  non-linear coordinate transfer between TimelineGroups. It declares both axes
  — source and target unit and number type — and is queried through
  get_coordinate_at(position) for one position or get_coordinates_at([...])
  for a batch; the object is not callable and exposes no raw arrays.
  inverse() returns a WarpMap with both units and both number types swapped.
